[workspace]
resolver = "3"
members = ["crates/core", "crates/cli"]

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.89"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Iioneua/AccountSweep"
publish = false

[workspace.dependencies]
accountsweep-core = { path = "crates/core", version = "0.0.1" }
anyhow = "1.0.104"
clap = { version = "4.6.9", features = ["derive"] }
directories = "6.0.0"
jsonschema = { version = "0.63.1", default-features = false }
psl = "2.1.260"
rusqlite = { version = "0.43.0", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
sha2 = "0.11.1"
time = { version = "0.3.55", features = ["parsing", "formatting", "macros"] }
toml = "1.2.2"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "warn"
print_stderr = "allow"
todo = "warn"
unwrap_used = "warn"

[profile.release]
codegen-units = 1
lto = "thin"
strip = "symbols"
