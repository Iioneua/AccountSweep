# cargo-deny configuration: https://embarkstudios.github.io/cargo-deny/
# Run locally with: cargo deny check

[graph]
all-features = true

[advisories]
# RustSec advisories: known vulnerabilities and unsound crates always fail the build.
unmaintained = "workspace"
yanked = "deny"
ignore = []

[licenses]
# Permissive licenses compatible with MIT OR Apache-2.0 distribution.
# Keep this list to licenses actually in use; adding one is a reviewed decision.
allow = [
    "Apache-2.0",
    "MIT",
    "MIT-0",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.9

# MPL-2.0 (file-level copyleft) is accepted only for these crates, used unmodified.
exceptions = [
    { allow = ["MPL-2.0"], crate = "option-ext" },
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
# Only crates.io; no git or alternative registries.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
