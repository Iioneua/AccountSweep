name: Bug report
description: Something doesn't work as described.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        **Do not paste real personal data.** Replace email addresses, account names, tokens and URLs with fake ones (e.g. `user@example.com`, `shop.example`). Security problems go through private reporting (see SECURITY.md).
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Commands you ran (with fake data), or what you asked the agent.
  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `accountsweep --version`.
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options: [Windows, macOS, Linux]
  - type: dropdown
    id: mode
    attributes:
      label: Mode
      options: [Basic (agent connectors), Advanced, Terminal only, Not sure]
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed all real email addresses, tokens and personal data from this report.
          required: true
